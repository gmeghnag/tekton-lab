apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: maven-deploy
spec:
  workspaces:
  - name: VOLUME
  steps:
    - name: maven-deploy
      image: docker.io/maven:3.8-openjdk-8
      workingDir: $(workspaces.VOLUME.path)
      script: |
        mvn deploy -Dmaven.test.skip=true -s settings.xml 
